# Tests und Namens-Scan bei jedem Push und Pull Request, auf Ubuntu und Windows.
# Ohne Mikrofon, GPU und Ollama: die Windows-/Hardware-Pakete ersetzt tests/conftest.py durch Attrappen.
# Die Windows-Vollpruefung (py whisperflow.py --selftest) laeuft nur am echten Rechner.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # bash auch unter Windows: in PowerShell waere E9,F63,F7,F82 eine Liste statt eines Arguments.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Namens-Scan (ruff)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests (pytest)
        run: python -m pytest -q
